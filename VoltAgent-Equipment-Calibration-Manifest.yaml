manifest_version: "1.1"
manifest_id: "voltagent-real-equipment-calibration"
project: "VoltAgent"
purpose: "Collect verified generator, grid-support inverter, battery, BMS, and measurement specifications for simulation calibration and safety review. This is an intake manifest, not an operating configuration or test authorization."

status:
  phase: research_only
  hardware_selected: false
  calibration_authorized: true
  hardware_test_authorized: false
  rule: "Unknown values remain null until supported by manufacturer documentation or verified measurements. Never infer safety limits from a similar model."

engineer_submission_checklist:
  rule: "Complete each item with exact-model evidence. Leave values null when evidence is unavailable; do not infer values or settings."
  items:
    - id: equipment_identity
      status: pending
      equipment: [generator, inverter_charger, high_battery_system, battery_management_system]
      required_records:
        - manufacturer 
        - exact_model
        - hardware_revision_and_firmware_where_applicable
        - serial_or_asset_id
      acceptable_evidence: "Equipment nameplate plus current official documents for the exact model and revision."
    - id: generator_dynamics_and_limits
      status: pending
      required_records:
        - rated_kw_kva_voltage_frequency_and_power_factor
        - engine_governor_and_alternator_models
        - frequency_droop_and_load_step_response
        - continuous_and_overload_limits_with_duration
        - generator_inverter_parallel_operation_limits
      acceptable_evidence: "Official generator, engine, governor, and alternator manuals/datasheets; approved test report if dynamic response is measured."
    - id: inverter_grid_support_behavior
      status: pending
      required_records:
        - supported_grid_forming_and_grid_supporting_modes
        - active_power_frequency_response_or_droop_curve
        - fast_frequency_response_or_virtual_inertia_behavior_if_supported
        - active_power_ramp_and_response_time
        - transient_overload_rating_and_duration
        - synchronization_transfer_and_generator_parallel_compatibility
        - signed_battery_power_command_limits_and_communications_behavior
      acceptable_evidence: "Official inverter manual, firmware-specific application note, protection document, and protocol/register map."
    - id: battery_and_bms_limits
      status: pending
      required_records:
        - chemistry_cell_configuration_voltage_capacity_and_energy
        - charge_and_discharge_limits_vs_soc_voltage_and_temperature
        - pulse_current_limits_and_permitted_duration
        - permitted_soc_and_temperature_ranges
        - bms_dynamic_limits_telemetry_alarms_and_disconnect_behavior
        - thermal_parameters_and_cycle_life_vs_depth_of_discharge
      acceptable_evidence: "Official battery and BMS datasheets/manuals for the exact models and firmware."
    - id: measurement_chain
      status: pending
      required_records:
        - sensor_and_data_acquisition_make_model_and_firmware
        - measurement_ranges_accuracy_and_calibration_status
        - sample_rates_latency_and_clock_alignment
        - sensor_locations_and_signal_sign_conventions
      acceptable_evidence: "Sensor datasheets, current calibration certificates, acquisition-system documentation, and measurement method."
    - id: site_diagram_and_protection
      status: pending
      required_records:
        - reviewed_single_line_diagram
        - breaker_fuse_conductor_earthing_and_neutral_details
        - independent_interlocks_manual_isolation_and_emergency_stop
        - communications_loss_sensor_failure_and_controller_failure_review
      acceptable_evidence: "Current site drawings and signed review by appropriately qualified electrical/controls personnel."
    - id: field_data_and_signoff
      status: pending
      required_records:
        - authorized_data_files_with_units_timestamps_and_source_classification
        - data_quality_and_uncertainty_review
        - unresolved_risks_and_required_engineering_signoffs
      acceptable_evidence: "Approved measurement/test records with method, date, instruments, uncertainty, and reviewer; simulation data must remain separately labelled."

evidence_policy:
  accepted_sources:
    - "Official manufacturer datasheet/manual with exact model and revision"
    - "Official communications protocol/register map"
    - "Qualified technician's signed test report"
    - "Calibrated instrument measurement with method, date, and uncertainty"
  every_value_requires:
    - value
    - unit
    - source_document_or_measurement_id
    - revision_or_date
    - page_section_or_register
    - verification_status: "unverified | document_verified | measurement_verified"
    - notes
  reject:
    - "Unlabelled values or screenshots"
    - "Simulation outputs presented as field measurements"
    - "Limits guessed from another product/model"

