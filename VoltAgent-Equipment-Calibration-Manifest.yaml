calibration_data:
  field_data_available: false
  data_files: []
  source_classification: "simulation | manufacturer_data | field_measurement"
  required_signals:
    timestamp: "ISO 8601 with timezone"
    generator_frequency: "Hz"
    generator_voltage: "V; phase reference stated"
    generator_current: "A; phase and RMS convention stated"
    generator_active_power: "kW"
    generator_apparent_power: "kVA"
    power_factor: "dimensionless"
    inverter_ac_input_power: "kW"
    battery_dc_voltage: "V"
    battery_current: "A; positive discharge/support and negative charge/absorption, or the documented device convention"
    battery_temperature: "degC; sensor location stated"
    battery_soc: "%; source and accuracy stated"
    battery_current_command: "Signed A or documented native unit; command sign convention and acknowledgement stated"
    command_acknowledgement: "status/value if supported"
    alarms_and_events: "coded event and timestamp"
  required_metadata:
    - "Exact equipment model and firmware"
    - "Sensor make/model, accuracy, calibration status, and location"
    - "Sampling rates and time alignment"
    - "Operating mode, initial conditions, and load-change timestamps"
    - "Missing samples, clipping, exclusions, and known limitations"
  data_quality_checks:
    - "Verify units and sign conventions"
    - "Check monotonic timestamps and signal alignment"
    - "Flag missing, duplicated, clipped, and implausible readings"
    - "Keep simulation and field data explicitly labelled and separate"
    - "Separate training, validation, and test experiments"

calibration_plan:
  generator:
    identify: ["rated operating point", "frequency response to load steps", "governor response/droop where applicable", "delays", "documented parallel-operation limits"]
    status: blocked_pending_verified_data
  inverter:
    identify: ["conversion efficiency", "command scaling/resolution/delay/ramp", "input acceptance and trip behavior", "documented grid-forming/grid-support functions and limits", "active-power/frequency response and generator parallel compatibility"]
    status: blocked_pending_verified_data
  battery:
    identify: ["charge/discharge and pulse limits versus SOC, voltage, and temperature", "electrical and thermal parameters", "cycle-life impact of transient support", "BMS limit/alarm behavior"]
    status: blocked_pending_verified_data
  uncertainty_analysis_required: true
  rule: "Document parameter ranges and sensitivity. Do not label an uncalibrated parameter as a measured equipment property."

safety_review:
  limits_must_come_from: "Exact manufacturer documentation or qualified engineering approval"
  required_before_hardware_test:
    - "Generator voltage/frequency envelope and overload limits"
    - "Inverter AC acceptance envelope, command limits, and trip behavior"
    - "Battery/BMS current, voltage, SOC, and temperature limits"
    - "Command magnitude, ramp-rate, and update-rate limits"
    - "Sensor validity, stale-data, and plausibility limits"
    - "Communications timeout and reviewed safe fallback"
    - "Applicable independent electrical and thermal protections"
    - "Manual override, isolation, emergency stop, and recovery procedure"
  ai_authority:
    allowed_before_validation: "simulation_only"
    direct_hardware_commands_allowed: false
    may_override_bms_or_inverter_protection: false
    independent_deterministic_safety_supervisor_required: true
  fallback_rule: "Do not invent a universal fallback command. Define it for the exact equipment after hazard review."

verification_gates:
  - id: G0
    name: equipment_identity_and_documents
    pass_criteria: "Exact models and current official documents recorded"
    status: blocked
  - id: G1
    name: measurement_and_data_quality
    pass_criteria: "Measurement chain, units, timing, uncertainty, and provenance reviewed"
    status: blocked
  - id: G2
    name: model_calibration
    pass_criteria: "Parameters identified; residuals, uncertainty, and validity range documented"
    status: blocked
  - id: G3
    name: offline_simulation_validation
    pass_criteria: "Predefined scenarios pass limits and comparison against baseline controller completed"
    status: not_started
  - id: G4
    name: safety_and_hazard_review
    pass_criteria: "Limits, failure modes, interlocks, fallback, and recovery approved by qualified reviewer"
    status: blocked
  - id: G5
    name: hardware_in_the_loop
    pass_criteria: "Test plan, instrumentation, stop conditions, and results reviewed"
    status: not_started
  - id: G6
    name: controlled_field_test
    pass_criteria: "Separate written authorization after prior gates and applicable regulatory review"
    status: not_authorized

signoff:
  data_collector: null
  electrical_engineer_reviewer: null
  controls_engineer_reviewer: null
  battery_bms_reviewer: null
  approval_date: null
  unresolved_risks: []
  note: "Completing this manifest does not authorize testing. A separately reviewed test plan and explicit approval are required."
